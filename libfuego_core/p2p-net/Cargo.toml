[package]
name = "p2p-net"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.53", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "kad",
    "mdns",
    "gossipsub",
    "ping",
    "macros",
    "ed25519",
] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
